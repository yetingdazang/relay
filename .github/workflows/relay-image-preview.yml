name: Relay image previews

on:
  push:
    branches:
      - main
    paths:
      - "notes/**/*.jpg"
      - "notes/**/*.jpeg"
      - "notes/**/*.png"
      - "notes/**/*.webp"
      - "notes/**/*.gif"
      - "notes/**/*.bmp"
      - "scripts/relay_image_preview.py"
      - ".github/workflows/relay-image-preview.yml"
  workflow_dispatch:
    inputs:
      image_path:
        description: "Optional: one existing image path under notes/ to process"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: relay-image-preview-main
  cancel-in-progress: false

jobs:
  encode-new-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image codec
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12"

      - name: Generate previews for added files only
        run: python scripts/relay_image_preview.py

      - name: Commit private preview tiles back to Relay
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- config/image-bridge/)" ]]; then
            echo "No new previews to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config/image-bridge/
          git commit -m "chore(relay): add image previews [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Preview files synced to main."
              exit 0
            fi
            echo "Concurrent push detected; rebasing ($attempt/3)."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflict: preview cache left unchanged on main."
              exit 1
            fi
          done
          echo "Unable to push previews after retries."
          exit 1
